# led_hal_root - runtime config
# Edit this file and SAVE. It is read on the fly (stat + reload) whenever the
# daemon processes an event, so edits apply without a rebuild or a restart.
#
# Sections (all optional):
#   [suppress]  one package per line - never lights the LED
#   [rules]     pkg=r,g,b             (0-255 per channel, comma separated)
#   [charge]    first_threshold / second_threshold (percent),
#               lower/middle/upper_range_light_type (0=off 1=breathing
#               2=flashing 3=static), lower/middle/upper_range_color
#               as r,g,b, rise/hold/fall/offt (breath ms)
#   [notify]    default_color as r,g,b, notify_light_type (0=off 1=breathing
#               2=flashing 3=static), rise/hold/fall/offt (breath ms),
#               notif_max_sec (0 = unlimited)
# Blank lines and lines starting with # or ; are ignored.
#
# Per-app colours are runtime-only: [rules] is the single source (the old
# link-time list in mods/rules.c is gone). Suppression is runtime-only too
# (no built-in blacklist anymore).
#
# Colour examples: 255,155,155 = nearly white on the AW2033 diode.

[suppress]
# Quiet background emitters that posts invisible notifications
# which would otherwise light the LED
com.google.android.googlequicksearchbox
com.socialnmobile.dictapps.notepad.color.note
com.android.providers.media.module
com.google.android.apps.nbu.files
com.android.systemui
org.amnezia.vpn
# core/system emitters (formerly built into the binary)
android
com.android.shell

[rules]
# pkg=r,g,b
com.whatsapp=0,255,0
org.telegram.messenger=255,0,255

[charge]
# Charge thresholds (percent). They split the charge range into lower /
# middle / upper. Order does not matter - values are swapped automatically.
#   lower  = charging below first_threshold
#   middle = charging between the two thresholds
#   upper  = charging at/above second_threshold, or Battery Full /
#            not charging in the upper range
first_threshold=90
second_threshold=95
rise=700
hold=100
fall=700
offt=900
# Per-range light type: 0 = off, 1 = breathing (fade), 2 = flashing
# (square blink; fades forced to 0), 3 = static (solid)
lower_range_light_type=1
middle_range_light_type=1
upper_range_light_type=3
# Per-range colors (r,g,b)
lower_range_color=255,0,0
middle_range_color=96,255,0
upper_range_color=0,255,0

[notify]
# Notification light type: 0 = off, 1 = breathing (fade), 2 = flashing
# (square blink; fades forced to 0), 3 = static (solid)
notify_light_type=1
# Notification-breath timing (ms) and max notification LED duration (s;
# 0 = unlimited, LED stays until screen wake / app cancel)
rise=500
hold=100
fall=500
offt=1200
notif_max_sec=0
# Colour for apps without a [rules] entry
default_color=255,150,150